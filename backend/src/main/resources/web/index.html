<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the stylesheet's env(safe-area-inset-*) padding keep content clear of a
         phone's notch and home indicator instead of the browser doing it with unusable letterboxing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="CamCadence" />
    <title>CamCadence</title>
    <link rel="icon" href="/favicon.ico" sizes="256x256" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="main.js"></script>
  </head>
  <body></body>
</html>
